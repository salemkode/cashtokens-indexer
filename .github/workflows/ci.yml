name: Verify indexer
on:
  pull_request:
  push:
    branches-ignore: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: env -u BCHN_TEST_BINARY node --import tsx --test --test-concurrency=1 test/*.test.ts
      - run: npm run build
      - run: python3 -B -m unittest discover -s test -p 'test_server_*.py' -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
